<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Ensemble — an outfit-aware fashion recommender and interactive portfolio demo.">
  <title>ensemble — fashion recommender</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="utility">
    <nav aria-label="Experience">
      <span>View</span>
      <button class="view-switch is-active" data-view="shop">Shop</button>
      <button class="view-switch" data-view="studio">DS Studio</button>
    </nav>
    <a href="https://github.com/yilalalalala/ensemble-outfit-recommender">View source ↗</a>
  </div>

  <header class="masthead">
    <nav class="nav nav-left" aria-label="Shop navigation">
      <button class="nav-link is-active" data-page="discover">Discover</button>
      <button class="nav-link" data-page="collections">Collections</button>
      <button class="nav-link" data-page="assistant">Style Assistant</button>
    </nav>
    <button class="wordmark" data-page="discover" aria-label="ensemble">
      <span>e</span><span>n</span><span>s</span><span>e</span><span>m</span><span>b</span><span>l</span><span>e</span>
    </button>
    <div class="nav-right">
      <button class="profile" aria-label="Demo profile, age 26"><b>26</b><span>Shopper</span></button>
      <button class="bag" aria-label="Open cart">Bag <span id="cart-count">0</span></button>
    </div>
  </header>

  <main id="content" tabindex="-1"></main>

  <footer>
    <span class="footer-mark">ensemble</span>
    <p>Interactive portfolio demo using a small sample from the local catalogue. The full model-backed application runs locally from this repository.</p>
    <a href="https://github.com/yilalalalala/ensemble-outfit-recommender">Code and evaluation reports ↗</a>
  </footer>

  <dialog id="cart" aria-labelledby="cart-title">
    <div class="dialog-head"><h2 id="cart-title">Your cart</h2><button class="close" aria-label="Close cart">×</button></div>
    <div id="cart-lines"></div>
    <div class="cart-total"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
    <button class="checkout" disabled>Checkout</button>
  </dialog>

  <div class="toast" role="status" aria-live="polite"></div>
</body>
</html>
