# Pipeline configuration. Sampling and model parameters live here, not in code
# (DATA.md "Sampling", D-006). A full-data run changes values, not code.

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  database: data/processed/ensemble.duckdb
  serving_db: data/processed/serving.sqlite
  reports: reports
  mlruns: mlruns

duckdb:
  memory_limit: 9GB
  threads: 8

splits:
  week_days: 7
  # Weeks of history used for features and retrieval (D-006).
  window_weeks: 16

sampling:
  min_basket_size: 2
  max_basket_size: 6
  min_pair_support: 10

retrieval:
  # Channel contract and merge: src/ensemble/candidates/retrieval.py. Each enabled
  # channel contributes its top <name>_k candidates per customer; ties break on
  # article_id. Caps are chosen on the recall / size frontier
  # (python -m ensemble.candidates.budget, reports/phase2/budget_frontier.json).
  # Phase 2 operating point (D-027): ~160 candidates/customer from the budget frontier.
  channels: [repeat, pop, pop_age, cf, variant, dept_pop, section_pop, covis, new_arrival_pers]
  repeat_weeks: 52       # repeat purchase: customer's own articles in this window
  repeat_k: 10
  pop_days: 7            # popularity window
  pop_metric: count      # count | decay | 1d | 3d | 14d | 28d (see _sales in retrieval.py)
  pop_half_life_days: 7  # for pop_metric: decay
  pop_k: 5
  pop_age_k: 65
  pop_age_age_bins: fine     # coarse = the 4 M1 baseline bands; fine = 10 bands
  new_arrival_days: 7    # launch proxy: first observed sale within this many days
  new_arrival_k: 10      # (disabled: the allocator gave it no budget at 160)
  cf_weeks: 8            # item-to-item co-purchase window
  cf_recent_items: 30    # most recent distinct items per customer used to build pairs
  cf_neighbors: 50       # neighbours kept per article
  cf_min_count: 3
  cf_seed_weeks: 16      # a customer's items from this window seed CF
  cf_k: 5
  variant_seed_weeks: 104 # a customer's items from this window seed other colourways
  variant_sales: count   # rank variants by sales in: count (pop_days) | 14d | 28d
  variant_k: 20
  # Category-conditioned popularity (_affinity_pop): <name>_key in
  # product_type_no | department_no | section_no | garment_group_no | type_index | dept_colour
  dept_pop_key: department_no
  dept_pop_weeks: 104
  dept_pop_types: 5
  dept_pop_items: 30
  dept_pop_by_age: true
  dept_pop_k: 40
  section_pop_key: section_no
  section_pop_weeks: 104
  section_pop_types: 5
  section_pop_items: 30
  section_pop_by_age: true
  section_pop_k: 65
  type_pop_key: product_type_no
  type_pop_weeks: 52
  type_pop_types: 5
  type_pop_items: 30
  type_pop_k: 0
  # Directional, time-weighted co-visitation (dst bought within gap days after src)
  covis_weeks: 8
  covis_gap_days: 7
  covis_beta: 0.0
  covis_min_count: 3
  covis_neighbors: 50
  covis_seed_weeks: 52
  covis_k: 25
  # Implicit ALS (fitted in a subprocess, cached in data/interim/als)
  als_weeks: 26
  als_factors: 64
  als_iterations: 15
  als_regularization: 0.05
  als_alpha: 20
  als_min_item_count: 5
  als_recency: true
  als_seed: 42
  als_pool_days: 7
  als_k: 0               # rejected (D-027): +0.06 pt recall for +75 s per week
  # Personalised new arrivals: launch-proxy articles in the customer's departments
  new_arrival_pers_weeks: 104
  new_arrival_pers_types: 5
  new_arrival_pers_items: 20
  new_arrival_pers_k: 10
  visual_k: 20           # FashionCLIP channel (M7a, D-023); allocator gave it no budget
  visual_pool_days: 14
  visual_profile_items: 20

budget:
  # Maximum cap per channel explored by the allocator (python -m ensemble.candidates.budget)
  pool: {repeat: 100, pop: 200, pop_age: 150, new_arrival: 100, cf: 100, variant: 60, dept_pop: 100,
         section_pop: 100, covis: 100, als: 100, new_arrival_pers: 60}
  # Channel parameters used while exploring (overrides retrieval.* for the allocator only)
  params: {variant_seed_weeks: 104, pop_age_age_bins: fine}
  targets: [80, 100, 116, 130, 160, 200, 250, 300]

features:
  use_clip: false        # ca_clip_sim_max / ca_clip_sim_mean ranker features (M7a)
  # Optional feature groups (src/ensemble/features/track_a.py): recency_affinity, short_velocity
  groups: [recency_affinity, short_velocity]

visual_adapter:
  hidden: 256
  batch_size: 512
  epochs: 12
  lr: 0.0003
  weight_decay: 0.0001
  temperature: 0.05
  seed: 42

ranker:
  train_weeks: 4           # label weeks preceding the evaluation week
  seed: 42                 # LightGBM seed (bagging, feature fraction); params also set deterministic
  neg_sample_rate: 0.5     # share of negative candidates kept in training weeks (deterministic hash, D-028)
  # Number of trees: fit on the older training weeks, early-stop on the most recent
  # training week (MAP@12), then refit on all training weeks with the best count.
  early_stopping: {max_rounds: 1500, patience: 60, refit: true}
  params:
    objective: lambdarank
    metric: map
    eval_at: [12]
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 100
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambdarank_truncation_level: 20
    verbosity: -1
    num_threads: 8
  num_boost_round: 200     # used only when early_stopping is empty

completion:
  window_weeks: 16          # baskets mined from this window before the target week
  universe_weeks: 4         # "live catalogue": sold in this window, or in the target week (D-013)
  pop_days: 7
  head_share: 0.10          # top 10% of each slot by sales = popularity head (tail-item recall)
  k: 12
  min_support: 3            # recommender threshold, chosen on validation (the funnel also reports 10)
  two_tower:
    dim: 64
    emb_dim: 16
    hidden: 256
    temperature: 0.05
    batch_size: 2048
    epochs: 3
    lr: 0.002
    id_dropout: 0.5         # drop article-ID embedding so the content path learns cold start
    pop_negatives: 64       # per slot per batch, drawn ∝ popularity^0.75
    hard_negatives: 4       # per positive: same product type and price tier
    negatives: [in_batch, logq, pop, hard]

serving:
  demo_returning: 300       # customers with rich recent history
  demo_new: 30              # customers with no purchases (user cold start)
  ctl_per_slot: 8
  max_per_product_type: 2   # diversity re-ranking inside a Complete the Look module
  trending_k: 24

rerank:
  # Re-ranking layer (src/ensemble/ranking/rerank.py), evaluated separately from the ranker.
  # The shipped policy is `serve`; the others are ablations reported in PHASE2_UPGRADE_REPORT.md.
  serve: {max_days_since_last_sale: 28}   # availability proxy (D-029)
  policies:
    none: {}
    availability_28d: {max_days_since_last_sale: 28}
    availability_14d: {max_days_since_last_sale: 14}
    styles_max2: {max_per_product_code: 2}
    styles_max1: {max_per_product_code: 1}
    types_max4: {max_per_product_type: 4}
    types_max3: {max_per_product_type: 3}
    styles2_types4: {max_per_product_code: 2, max_per_product_type: 4}

# ---------------------------------------------------------------- Track B Round 3
# Leakage-free rolling protocol + learned fusion (docs/DECISIONS.md D-030..D-035).
# The Round-1 `completion:` block above still drives `make track-b`; this block
# drives `python -m ensemble.completion.backtest`.
track_b:
  folds: 6                  # consecutive label weeks ending at validation (test week untouched)
  train_weeks: 2            # ranker label weeks before each fold (point-in-time per week)
  window_weeks: 16          # baskets mined from this window before the target week
  universe_weeks: 4         # eligible catalogue: sold in this window BEFORE the cutoff (D-030)
  pop_days: 7
  k: 12
  head_share: 0.10          # top 10% of each slot by window sales = popularity head
  new_item_days: 28         # "recently launched" segment: first observed sale within this many days
  min_basket_size: 2
  max_basket_size: 6
  customer_weeks: 104       # history window for the point-in-time customer features (Phase 3)
  min_support: 2            # mining floor; support stays a ranker feature, not a hard choice
  half_lives_days: [14, 56] # time-decayed co-counts (Phase 4.2)
  basket_filter: ""         # extra SQL predicate on tb_bk (Phase 4.5 ablation)
  candidates:               # per-source budget per query (operating point: D-032)
    assoc_co: 100
    assoc_npmi: 100
    style_co: 60
    style_npmi: 60
    two_tower: 80
    two_tower_content: 40
    slot_pop: 100
  train_queries: 30000      # deterministic customer-level subsample per training week
  neg_sample_rate: 0.35     # share of negative candidates kept in training weeks
  personalization: true
  use_clip: true            # FashionCLIP vectors in the towers and as a ranker feature
  # Feature-group ablations (ensemble.completion.features.GROUPS). Each entry refits the
  # ranker with that group removed, on every fold, in the same evaluation pass. Not part
  # of the cache key: the feature matrices are unchanged, only the fitted model differs.
  feature_ablations: [repeat, towers, clip, association, style_backoff, decay, popularity, price+colour]
  # Phase 7: what serving's Complete-the-Look diversity rules cost in accuracy. Each variant
  # re-ranks the shipping model's top `pool` candidates and is scored as its own system.
  serving_rules:
    model: lgbm_compatibility
    pool: 48
    variants:
      one_colourway: {one_per_product_code: true}
      max2_per_type: {max_per_product_type: 2}
      shipped: {one_per_product_code: true, max_per_product_type: 2}
      # What serving actually does: the caps are hard, so a module may be short.
      shipped_strict: {one_per_product_code: true, max_per_product_type: 2, fill_back: false}
  eval_chunk_queries: 8000
  bootstrap: {n_boot: 1000, seed: 0}
  ranker:
    seed: 42
    early_stopping: {max_rounds: 1200, patience: 50, refit: true}
    num_boost_round: 300
    params:
      objective: lambdarank
      metric: ndcg
      eval_at: [12]
      learning_rate: 0.05
      num_leaves: 63
      min_child_samples: 50
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 1
      lambdarank_truncation_level: 20
      verbosity: -1
      num_threads: 8
  two_tower:
    dim: 64
    emb_dim: 16
    hidden: 256
    temperature: 0.05
    batch_size: 4096
    epochs: 6
    lr: 0.002
    id_dropout: 0.5
    negatives: [in_batch, logq]
    hard_negatives: 0        # redesigned retrieval-informed hard negatives (Phase 5); 0 = off
    hard_pool: 200           # candidate pool per slot for retrieval-informed mining
    early_stopping_patience: 2
    holdout_days: 7          # last days of the mining window held out for model selection
    seed: 0
