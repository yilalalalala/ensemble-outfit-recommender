# Public demo build (docs/CLAUDECODE_PUBLIC_DEMO_FULL_UI_PLAN.md, D-046).
#
# `python -m ensemble.api.public_demo build` assembles portfolio/ from the real frontend
# (src/ensemble/api/static) plus frozen responses captured from the local serving store and,
# for the photo and assistant surfaces, from the running local FastAPI app.
#
# Nothing here feeds a model, a feature or an evaluation: it only chooses which verified
# outputs are published.

out: portfolio                      # build target (deployed by .github/workflows/pages.yml)
fixtures: demo                      # fixture directory inside `out`
images: images                      # catalogue photography inside `out`

# Demo profiles published in the profile picker. The first is the default, and is the profile the
# local app itself falls back to (first returning row of /api/customers).
customers: [168058, 892186, 133835, 477553, 5334]
default_customer: 168058

catalog:
  # Catalogue photography is republished downscaled: the card grid never renders wider than ~600 CSS px.
  image_width: 760
  image_quality: 80
  # Colourways published per product family (cards show at most 6 swatches plus a "+N" link).
  max_variants_per_family: 5
  # Complete-the-Look items are published from a bounded pool: every captured module is the live
  # response filtered to published articles, in the response's own order.
  ctl_pool: 140
  ctl_k: 8                          # k used when capturing /api/v2/complete-the-look
  similar_k: 8                      # "Similar items" per product page, drawn from published articles
  min_module_items: 2               # a module with fewer published items is dropped, never padded

# Captured from the running local app (make serve). `base` is only used at build time.
capture:
  base: http://localhost:8031

# Outfit photo for the stored photo examples. Openly licensed (see data/raw/outfit_photos/CREDITS.csv);
# private test photos are never published.
photo:
  file: full_03.jpg
  width: 900
  quality: 84
  visual_search_category: top
  # Fractions x1,y1,x2,y2 of the displayed photo, matching the stored garment detection for the top.
  visual_search_box: "0.342,0.172,0.517,0.545"

# Stored Style Assistant conversation. Each saved exchange is one real conversation with the local
# assistant endpoint at build time, frozen verbatim; `followup_of` continues its parent's
# conversation. `customer` says whether the exchange was signed in (personalised recommendations) or
# a guest (catalogue questions), matching how the eval set asks each kind of question.
assistant:
  customer: null                    # default for a question that does not set one
  questions:
    - id: shoes_wide_leg
      text: What shoes go with wide-leg jeans?
    - id: wedding_dress
      text: I need an elegant dress to wear as a wedding guest.
    - id: ankle_boots
      text: Show me black ankle boots.
    - id: gold_hoops
      text: I'm looking for gold hoop earrings.
    - id: reco_top
      text: Recommend me a top.
      customer: 168058
    - id: reco_top_bottoms
      text: I like the first one. What bottoms go with it?
      followup_of: reco_top
      customer: 168058
    - id: brand
      text: Do you have Gucci loafers?
    - id: offtopic
      text: What's the weather in Stockholm tomorrow?
  # Shown as the suggestion chips in the empty conversation (the rest stay reachable from the
  # saved-questions note).
  suggested: [shoes_wide_leg, wedding_dress, gold_hoops]

# Headline values the published fixtures must reproduce exactly (tests/test_public_demo.py).
# Sourced from the serving store's `reports` table, which is what the local DS Studio reads.
headline:
  ranker_test_map12: "0.03918"
  ranker_test_lift_vs_best_baseline: "+45.7%"
  ranker_val_map12: "0.03772"
  track_b_models_compared: 10
  stored_reports: 7
