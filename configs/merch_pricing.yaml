# Prototype merchandising prices (USD) for the shop UI.
#
# The H&M source data has no trustworthy US retail price (transactions carry a normalised,
# unit-less `price`), so these are NOT historical or source-dataset prices. They are portfolio/demo
# merchandising prices that make the prototype behave like a US store. They never feed a model
# feature, an evaluation, or a report metric.
#
# Rule (src/ensemble/api/merch.py):
#   1. band  = by_product_type[product_type_name] or by_product_group[product_group_name] or default
#   2. scale = index_group multiplier × premium multiplier (department name contains "Premium")
#   3. price = one of `price_points` inside [low × scale, high × scale], chosen by
#              sha256(product_code) — stable across reloads, routes, customers and processes.
# The band uses the family's canonical article (lowest article_id), so every colourway of one
# product family has the same price.

price_points: [3.99, 4.99, 5.99, 6.99, 7.99, 8.99, 9.99, 12.99, 14.99, 17.99, 19.99, 24.99, 27.99,
               29.99, 34.99, 39.99, 44.99, 49.99, 54.99, 59.99, 69.99, 79.99, 89.99, 99.00, 119.00,
               129.00, 149.00, 179.00, 199.00, 249.00]

