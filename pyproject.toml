[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble"
version = "0.1.0"
description = "Fashion recommender on the H&M dataset: next-purchase ranking and outfit completion"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Ignore Finder/sync duplicates such as "test_x 2.py": they are not part of the suite.
addopts = "--ignore-glob='* 2.py'"
pythonpath = ["src"]
markers = ["data: requires the raw dataset and built database"]
