[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble"
version = "0.1.0"
description = "Fashion recommender on the H&M dataset: next-purchase ranking and outfit completion"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["data: requires the raw dataset and built database"]
